<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | On-Duty Masters</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="preload" href="/assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face {
      font-family: 'Plus Jakarta Sans';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('/assets/fonts/plus-jakarta-sans-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    @font-face {
      font-family: 'Plus Jakarta Sans';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('/assets/fonts/plus-jakarta-sans-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      --bg-primary:   #0D0F1A;
      --accent-main:  #496DEE;
      --text-primary: #F0F0F5;
      --text-muted:   #8B8FA8;
      --gradient:     linear-gradient(135deg, #496DEE, #6B8DF5);
      --radius-pill:  999px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem 1rem;
      text-align: center;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }
    .blob {
      position: fixed;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: var(--accent-main);
      filter: blur(140px);
      opacity: 0.25;
      z-index: -1;
    }
    .logo img { width: 200px; height: auto; }
    .code {
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    h1 { font-size: clamp(1.25rem, 3vw, 1.75rem); font-weight: 600; }
    p  { color: var(--text-muted); max-width: 440px; line-height: 1.7; }
    .btn {
      display: inline-block;
      padding: 0.875rem 2rem;
      border-radius: var(--radius-pill);
      background: var(--gradient);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .btn:hover, .btn:focus-visible { transform: translateY(-2px); box-shadow: 0 0 40px rgba(73, 109, 238, 0.35); }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  </style>
</head>
<body>
  <div class="blob" aria-hidden="true"></div>
  <a class="logo" href="/" aria-label="On-Duty Masters — Home"><img src="/assets/logo.svg" alt="On-Duty Masters" width="210" height="44" /></a>
  <div class="code" aria-hidden="true">404</div>
  <main>
    <h1 data-tr="Aradığınız sayfa bulunamadı" data-en="Page not found">Page not found</h1>
    <p data-tr="Sayfa taşınmış ya da hiç var olmamış olabilir. Ana sayfaya dönüp oradan devam edebilirsiniz."
       data-en="The page may have moved or never existed. Head back to the homepage and continue from there.">The page may have moved or never existed. Head back to the homepage and continue from there.</p>
  </main>
  <a class="btn" href="/" data-tr="Ana Sayfaya Dön" data-en="Back to Homepage">Back to Homepage</a>

  <script>
    (function () {
      var lang = 'en';
      try { lang = localStorage.getItem('eb-lang') || lang; } catch (e) {}
      if (lang !== 'tr') return;
      document.documentElement.lang = 'tr';
      document.title = '404 — Sayfa Bulunamadı | On-Duty Masters';
      document.querySelectorAll('[data-tr]').forEach(function (el) { el.textContent = el.dataset.tr; });
    })();
  </script>
</body>
</html>
